# Global
namespace: chatterly-dev
environment: dev

# Slack alerting

slack:
  channel: "#chatterly-alerts"
  secret:
    name: slack-webhook-secret
    key: webhook-url

# API
api:
  image:
    repository: osmankhandev/chatterly-api
    tag: dev-latest
    pullPolicy: Always
  replicas: 1
  port: 3001
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  health:
    readiness:
      initialDelaySeconds: 15
      periodSeconds: 10
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 30

# Postgres
postgres:
  image: postgres:16-alpine
  storage: 1Gi
  storageClass: local-path
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Redis
redis:
  image: redis:7-alpine
  storage: 1Gi
  storageClass: local-path
  maxmemory: 256mb
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

# Ingress
ingress:
  enabled: false
  className: nginx
  host: ""

# Key Vault
keyVault:
  enabled: false
  name: kv-chatterly-dev
  tenantId: 229929b3-9d7d-48ef-b948-b175d426ee74
  identityClientId: 0cc634fd-dba5-4e58-b816-44850fed678b

# Add this to your values.yaml
monitoring:
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false
  alertmanagerConfig:
    enabled: false
  secretProviderClass:
    enabled: false

localSecrets:
  DATABASE_URL: ""
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  REDIS_URL: ""
  POSTGRES_DB: ""
  PORT: ""

  LOG_LEVEL: ""
  JWT_ACCESS_SECRET: ""
  JWT_REFRESH_SECRET: ""
  JWT_ACCESS_EXPIRE: ""
  JWT_REFRESH_EXPIRE: ""
  # Email/SMTP Configuration
  EMAIL_HOST: ""
  EMAIL_PORT: ""
  EMAIL_USER: ""
  EMAIL_PASS: ""
  EMAIL_FROM: ""
  # SMS/Twilio Configuration
  TWILIO_ACCOUNT_SSID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_PHONE_NUMBER: ""
  TWILIO_RECOVERY_NUMBER: ""
