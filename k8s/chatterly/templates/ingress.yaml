{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatterly-ingress
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-svc
                port:
                  number: {{ .Values.api.port }}
          - path: /health
            pathType: Prefix
            backend: 
              service:  
                name: api-svc
                port:
                  number: {{ .Values.api.port }}

{{- end }}
