trigger:
- main
- development

pr:
- main
- development

pool:
  name: Default

variables:
- group: chatterly-secrets-ec2-8gb
- name: DOCKER_USERNAME
  value: 'osmankhandev'
- name: IMAGE_NAME
  value: 'chatterly-api'
- name: API_IMAGE
  value: '$(DOCKER_USERNAME)/$(IMAGE_NAME)'

stages:

- stage: Build
  jobs:
  - job: BuildAPIProject
    displayName: 'Build Chatterlys API Project'

    steps:

    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
    - script: npm ci
      displayName: 'Install Dependencies'

    - script: npx prisma generate --schema=apps/api/prisma/schema.prisma
      displayName: 'Prisma Generate'

    - script: npx nx build api
      displayName: 'Build Affected Apps Like API In this Time'

    - script: |
        docker build -t $(DOCKER_USERNAME)/$(IMAGE_NAME):$(Build.BuildId) -f apps/api/Dockerfile .
      displayName: 'Docker Build'

    - script: |
        docker tag $(DOCKER_USERNAME)/$(IMAGE_NAME):$(Build.BuildId) $(DOCKER_USERNAME)/$(IMAGE_NAME):latest
      displayName: 'Tag Docker Image'

    - task: Docker@2
      displayName: 'Login to Docker Hub'
      inputs:
        command: 'login'
        containerRegistry: 'dockerhub-connection'
    - task: Docker@2
      displayName: 'Push API Image to Docker Hub'
      inputs:
        command: 'push'
        repository: '$(DOCKER_USERNAME)/$(IMAGE_NAME)'
        tags: |
          $(Build.BuildId)
          latest

- stage: Deploy
  displayName: 'Deploy to EC2 Instance'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/development'))
  jobs:
  - deployment: DeployToEC2
    displayName: 'Deploy API to EC2'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "Host is: $(EC2_HOST)"
              echo "User is: $(EC2_USER)"
              echo "Key length: ${#EC2_SSH_KEY}"
            displayName: 'Debug variables'
          # No Need to SSH since CI Agent is on EC2 already — we can directly run commands on the host machine
          - script: |
              # No SSH needed — agent IS on EC2 already

              echo "=== Copying compose file ==="
              cp $(Build.SourcesDirectory)/docker-compose.prod.yml \
                 /home/ubuntu/chatterly/docker-compose.yml

              cd /home/ubuntu/chatterly

              echo "=== Logging into Docker Hub ==="
              echo "$(DOCKERHUB_PSW)" | \
              docker login -u "$(DOCKER_USERNAME)" --password-stdin

              echo "=== Pulling latest images ==="
              docker pull $(API_IMAGE):latest

              echo "=== Starting containers ==="
              docker compose --env-file /home/ubuntu/.env.production up -d --remove-orphans

              echo "=== Running migrations ==="
              docker compose --env-file /home/ubuntu/.env.production \
                exec -T api \
                npx prisma migrate deploy --schema=./prisma/schema.prisma

              echo "=== Health check ==="
              sleep 10
              curl -f http://localhost:3001/health || exit 1

              docker logout
            displayName: 'Deploy on EC2'

          - script: rm -f ~/.ssh/ec2_key.pem
            displayName: 'Clean up SSH Key'
            condition: always()
