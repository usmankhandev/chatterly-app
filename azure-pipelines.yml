trigger:
- development
pr:
- development
- main
pool:
  name: Chatterly

variables:
- group: 'chatterly-agent-sse-5979'
- template: ./.azure-pipelines/templates/variables/common.yaml
- name: system.debug
  value: 'true'

extends:
  template: ./.azure-pipelines/templates/stages/build-node.yaml
  parameters:
    serviceName: api
    dockerImage: chatterly-api
    acrName: acrchatterlydev
    helmChart: ./k8s/chatterly
    helmRelease: chatterly-dev
    namespace: chatterly-dev
    valuesFile: ./k8s/chatterly/values-dev.yaml
    healthCheckUrl: http://20.81.15.81/health
    runTests: true
    runTrivy: true
