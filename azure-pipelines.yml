trigger:
- main
- development

pr:
- main
- development

pool:
  name: Default

variables:
- group: chatterly-secrets-ec2-8gb
- name: DOCKER_USERNAME
  value: 'osmankhandev'
- name: IMAGE_NAME
  value: 'chatterly-api'
- name: API_IMAGE
  value: '$(DOCKER_USERNAME)/$(IMAGE_NAME)'

stages:

- stage: Build
  jobs:
  - job: BuildAPIProject
    displayName: 'Build Chatterlys API Project'

    steps:

    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
    - script: npm ci
      displayName: 'Install Dependencies'

    - script: npx prisma generate --schema=apps/api/prisma/schema.prisma
      displayName: 'Prisma Generate'

    - script: npx nx build api
      displayName: 'Build Affected Apps Like API In this Time'

    - script: |
        docker build -t $(DOCKER_USERNAME)/$(IMAGE_NAME):$(Build.BuildId) -f apps/api/Dockerfile .
      displayName: 'Docker Build'

    - script: |
        docker tag $(DOCKER_USERNAME)/$(IMAGE_NAME):$(Build.BuildId) $(DOCKER_USERNAME)/$(IMAGE_NAME):latest
      displayName: 'Tag Docker Image'

    - task: AzureCLI@2
      displayName: 'Build and Push to ACR'
      inputs:
        azureSubscription: 'azure-hardcore-service-connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "=== Login to ACR ==="
          az acr login --name acrchatterlydev

          echo "=== Build image ==="
          docker build \
            -t acrchatterlydev.azurecr.io/chatterly-api:$(Build.BuildId) \
            -t acrchatterlydev.azurecr.io/chatterly-api:latest \
            -f apps/api/Dockerfile .

          echo "=== Push to ACR ==="
          docker push acrchatterlydev.azurecr.io/chatterly-api:$(Build.BuildId)
          docker push acrchatterlydev.azurecr.io/chatterly-api:latest

- stage: DeployToAKS
  displayName: 'Deploy to AKS'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/development'))
  jobs:
  - deployment: DeployToAKS
    displayName: 'Deploy API to AKS'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:

          # ── CRITICAL: checkout source code ───────────────────────
          # deployment jobs don't auto-checkout — must be explicit
          - checkout: self
            displayName: 'Checkout Source Code'

          # ── Step 1: Azure login + AKS credentials ─────────────────
          - task: AzureCLI@2
            displayName: 'Get AKS Credentials'
            inputs:
              azureSubscription: 'azure-hardcore-service-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az aks get-credentials \
                  --resource-group rg-chatterly-dev \
                  --name aks-chatterly-dev \
                  --overwrite-existing
                kubectl get nodes

          # ── Step 2: Update image tag ───────────────────────────────
          - script: |
              sed -i "s|crchatterlydev.azurecr.io/chatterly-api:latest|crchatterlydev.azurecr.io/chatterly-api:$(Build.BuildId)|g" \
                $(Build.SourcesDirectory)/k8s/base/api/deployment.yaml
              grep "image:" $(Build.SourcesDirectory)/k8s/base/api/deployment.yaml
            displayName: 'Update Image Tag'

          # ── Step 3: Apply in strict order ─────────────────────────
          - task: AzureCLI@2
            displayName: 'Apply K8s Manifests'
            inputs:
              azureSubscription: 'azure-hardcore-service-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "=== 1. Namespace ==="
                kubectl apply -f $(Build.SourcesDirectory)/k8s/base/namespace.yaml

                echo "=== 2. Config ==="
                kubectl apply -f $(Build.SourcesDirectory)/k8s/base/configmap.yaml
                kubectl apply -f $(Build.SourcesDirectory)/k8s/base/secret.yaml

                echo "=== 3. Postgres ==="
                kubectl apply -f $(Build.SourcesDirectory)/k8s/base/postgres/statefulset.yaml

                echo "=== 4. Wait for Postgres pod ready ==="
                kubectl wait --for=condition=ready pod \
                  -l app=postgres \
                  -n chatterly-dev \
                  --timeout=180s

                echo "=== 5. Redis ==="
                kubectl apply -f $(Build.SourcesDirectory)/k8s/base/redis/deployment.yaml

                echo "=== 6. Wait for Redis pod ready ==="
                kubectl wait --for=condition=ready pod \
                  -l app=redis \
                  -n chatterly-dev \
                  --timeout=120s

                echo "=== 7. API ==="
                kubectl apply -f $(Build.SourcesDirectory)/k8s/base/api/deployment.yaml
                kubectl apply -f $(Build.SourcesDirectory)/k8s/base/api/service.yaml

          # ── Step 4: Wait for API rollout ───────────────────────────
          - task: AzureCLI@2
            displayName: 'Wait for API Rollout'
            inputs:
              azureSubscription: 'azure-hardcore-service-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                kubectl rollout status deployment/api \
                  -n chatterly-dev \
                  --timeout=300s

          # ── Step 5: Verify ─────────────────────────────────────────
          - task: AzureCLI@2
            displayName: 'Verify Deployment'
            inputs:
              azureSubscription: 'azure-hardcore-service-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "=== Pods ==="
                kubectl get pods -n chatterly-dev

                echo "=== Services ==="
                kubectl get svc -n chatterly-dev

                echo "=== API Public IP ==="
                kubectl get svc api-svc -n chatterly-dev

          # ── Step 6: Cleanup ────────────────────────────────────────
          - script: rm -f ~/.kube/config
            displayName: 'Cleanup kubeconfig'
            condition: always()
