trigger:
- main
- development

pr:
- main
- development

pool:
  name: Chatterly

variables:
- group: chatterly-agent-sse-5979
- name: DOCKER_USERNAME
  value: 'osmankhandev'
- name: IMAGE_NAME
  value: 'chatterly-api'
- name: API_IMAGE
  value: '$(DOCKER_USERNAME)/$(IMAGE_NAME)'

stages:

- stage: Build
  jobs:
  - job: BuildAPIProject
    displayName: 'Build Chatterlys API Project'

    steps:

    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
    - script: npm ci
      displayName: 'Install Dependencies'

    - script: npx prisma generate --schema=apps/api/prisma/schema.prisma
      displayName: 'Prisma Generate'

    - script: npx nx build api
      displayName: 'Build Affected Apps Like API In this Time'

    - script: |
        docker build -t $(DOCKER_USERNAME)/$(IMAGE_NAME):$(Build.BuildId) -f apps/api/Dockerfile .
      displayName: 'Docker Build'

    - script: |
        docker tag $(DOCKER_USERNAME)/$(IMAGE_NAME):$(Build.BuildId) $(DOCKER_USERNAME)/$(IMAGE_NAME):latest
      displayName: 'Tag Docker Image'

    - task: AzureCLI@2
      displayName: 'Build and Push to ACR'
      inputs:
        azureSubscription: 'azure-hardcore-service-connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "=== Login to ACR ==="
          az acr login --name acrchatterlydev

          echo "=== Build image ==="
          docker build \
            -t acrchatterlydev.azurecr.io/chatterly-api:$(Build.BuildId) \
            -t acrchatterlydev.azurecr.io/chatterly-api:latest \
            -f apps/api/Dockerfile .

          echo "=== Push to ACR ==="
          docker push acrchatterlydev.azurecr.io/chatterly-api:$(Build.BuildId)
          docker push acrchatterlydev.azurecr.io/chatterly-api:latest

- stage: DeployToAKS
  displayName: 'Deploy to AKS'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/development'))
  jobs:
  - deployment: DeployToAKS
    displayName: 'Deploy API to AKS'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:

          # ── CRITICAL: checkout source code ───────────────────────
          # deployment jobs don't auto-checkout — must be explicit
          - checkout: self
            displayName: 'Checkout Source Code'

          # ── Step 1: Azure login + AKS credentials ─────────────────
          - task: AzureCLI@2
            displayName: 'Get AKS Credentials'
            inputs:
              azureSubscription: 'azure-hardcore-service-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az aks get-credentials \
                  --resource-group rg-chatterly-dev \
                  --name aks-chatterly-dev \
                  --overwrite-existing
                kubectl get nodes

          # ── Step 2: Update image tag ───────────────────────────────
          - script: |
              sed -i "s|crchatterlydev.azurecr.io/chatterly-api:latest|crchatterlydev.azurecr.io/chatterly-api:$(Build.BuildId)|g" \
                $(System.DefaultWorkingDirectory)/k8s/base/api/deployment.yaml
              grep "image:" $(System.DefaultWorkingDirectory)/k8s/base/api/deployment.yaml
            displayName: 'Update Image Tag'

          # ── Step 3: Apply in strict order ─────────────────────────
          - task: AzureCLI@2
            displayName: 'Apply K8s Manifests'
            inputs:
              azureSubscription: 'azure-hardcore-service-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                
                echo "=== Workspace contents ===" 
                ls $(System.DefaultWorkingDirectory)/
                echo "=== K8s folder ===" 
                ls $(System.DefaultWorkingDirectory)/k8s/ 2>/dev/null || echo "k8s folder NOT FOUND" 
                echo "=== Build source dir ===" 
                echo $(System.DefaultWorkingDirectory)

                set -x

                echo "=== Files available ===" 
                ls $(System.DefaultWorkingDirectory)/k8s/base/ 
                ls $(System.DefaultWorkingDirectory)/k8s/base/postgres/ 
                ls $(System.DefaultWorkingDirectory)/k8s/base/redis/

                echo "=== 1. Namespace ===" 
                kubectl apply -f $(System.DefaultWorkingDirectory)/k8s/base/namespace.yaml || exit 1

                echo "=== 2. Config ==="
                kubectl apply -f $(System.DefaultWorkingDirectory)/k8s/base/configmap.yaml || exit 1
                kubectl apply -f $(System.DefaultWorkingDirectory)/k8s/base/secret.yaml || exit 1

                echo "=== 3. Postgres ==="
                kubectl apply -f $(System.DefaultWorkingDirectory)/k8s/base/postgres/statefulset.yaml || exit 1

                echo "=== Verify postgres StatefulSet created ===" 
                kubectl get statefulset -n chatterly-dev || exit 1

                kubectl get pods -n chatterly-dev || exit 1

                echo "=== 4. Wait for Postgres pod ready ==="
                sleep 10 # give it a few seconds to start creating the pod
                kubectl wait --for=condition=ready pod \
                  -l app=postgres \
                  -n chatterly-dev \
                  --timeout=180s || exit 1

                echo "=== 5. Redis ==="
                kubectl apply -f $(System.DefaultWorkingDirectory)/k8s/base/redis/deployment.yaml || exit 1

                echo "=== 6. Wait for Redis pod ready ==="
                kubectl wait --for=condition=ready pod \
                  -l app=redis \
                  -n chatterly-dev \
                  --timeout=120s || exit 1

                echo "=== 7. API ==="
                kubectl apply -f $(System.DefaultWorkingDirectory)/k8s/base/api/deployment.yaml || exit 1
                kubectl apply -f $(System.DefaultWorkingDirectory)/k8s/base/api/service.yaml || exit 1


                echo "=== 8. Ingress ==="
                kubectl apply -f $(System.DefaultWorkingDirectory)/k8s/base/ingress.yaml || exit 1

                echo "=== 9. Verify Ingress created ==="
                kubectl get ingress -n chatterly-dev || exit 1

                echo "=== 10. Verify API Service created ==="
                kubectl get svc api-svc -n chatterly-dev || exit 1

                echo "=== Done ==="

          # ── Step 4: Wait for API rollout ───────────────────────────
          - task: AzureCLI@2
            displayName: 'Wait for API Rollout'
            inputs:
              azureSubscription: 'azure-hardcore-service-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                kubectl rollout status deployment/api \
                  -n chatterly-dev \
                  --timeout=300s || exit 1

          # ── Step 5: Verify ─────────────────────────────────────────
          - task: AzureCLI@2
            displayName: 'Verify Deployment'
            inputs:
              azureSubscription: 'azure-hardcore-service-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "=== Pods ==="
                kubectl get pods -n chatterly-dev

                echo "=== Services ==="
                kubectl get svc -n chatterly-dev

                echo "=== API Public IP ==="
                kubectl get svc api-svc -n chatterly-dev

          # ── Step 6: Cleanup ────────────────────────────────────────
          - script: rm -f ~/.kube/config
            displayName: 'Cleanup kubeconfig'
            condition: always()
