services:
  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db-chatterly
    restart: unless-stopped
    env_file:
      - .env.development
    environment:
      NODE_ENV: development
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis-db:
    image: redis:7-alpine
    container_name: redis-db-chatterly
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Application Services ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    container_name: api-chatterly
    restart: unless-stopped
    env_file:
      - .env.development
    ports:
      - '3001:3001'

    environment:
      NODE_ENV: development
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-db:
        condition: service_started

  jenkins-server:
    image: jenkins/jenkins:lts
    container_name: jenkins-server-chatterly
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - jenkins_home:/var/jenkins_home

  vault-server:
    image: hashicorp/vault:latest
    container_name: vault-server-chatterly
    restart: unless-stopped
    env_file:
      - .env.development
    ports:
      - '8200:8200'
    environment:
      NODE_ENV: development
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_TOKEN}
    volumes:
      - vault_data:/vault/data
    cap_add:
      - IPC_LOCK

volumes:
  postgres_data:
  redis_data:
  jenkins_home:
  vault_data:
