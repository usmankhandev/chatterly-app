services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db-chatterly
    restart: always
    env_file: .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chatterly-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports exposed - only accessible within Docker network
    # Postgres should NEVER be exposed on EC2 public IP

  redis-db:
    image: redis:7-alpine
    container_name: redis-db-chatterly
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    env_file: .env.production
    volumes:
      - redis_data:/data
    networks:
      - chatterly-net
    # No ports exposed - internal only

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: osmankhandev/chatterly-api:latest
    container_name: api-chatterly
    restart: on-failure:5
    env_file:
      - .env.production
    ports:
      - '3001:3001'
    networks:
      - chatterly-net
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-db:
        condition: service_started

    command: sh -c "echo 'Waiting for database...' &&
      until nc -z 127.0.0.1 5432; do
      echo 'Database not ready, retrying in 3 seconds...';
      sleep 3;
      done &&
      echo 'Database is ready!' &&
      npx prisma migrate deploy --schema=./prisma/schema.prisma &&
      node index.js"

networks:
  chatterly-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
